<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else 'ClauseAI' }}</title>
    {% if description %}
    <meta name="description" content="{{ description }}">
    {% endif %}
    {% if noindex %}
    <meta name="robots" content="noindex, follow">
    {% endif %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">
    <header class="border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <a href="/" class="text-lg font-semibold text-gray-900">ClauseAI</a>
        </div>
    </header>
    <main class="flex-1 {% block main_classes %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-gray-200 mt-auto">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-sm text-gray-500">
            Templates are attorney-drafted by
            <a class="underline" href="https://general.legal">General Legal</a>
            and released under CC0. They are not legal advice.
        </div>
    </footer>
</body>
</html>
